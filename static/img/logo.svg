<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4aa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f5c4;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="20" cy="20" r="18" fill="#111113" stroke="url(#grad)" stroke-width="1.5"/>
  <!-- N shape - connected nodes -->
  <path d="M12 28V12l8 16V12" stroke="url(#grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Nodes at vertices -->
  <circle cx="12" cy="28" r="2.5" fill="#00d4aa"/>
  <circle cx="12" cy="12" r="2.5" fill="#00d4aa"/>
  <circle cx="20" cy="28" r="2.5" fill="#00d4aa"/>
  <circle cx="20" cy="12" r="2.5" fill="#00d4aa"/>
  <!-- Center node -->
  <circle cx="28" cy="20" r="2" fill="#00f5c4" opacity="0.7"/>
  <!-- Connection lines to center -->
  <line x1="20" y1="12" x2="28" y2="20" stroke="#00d4aa" stroke-width="1" opacity="0.4"/>
  <line x1="20" y1="28" x2="28" y2="20" stroke="#00d4aa" stroke-width="1" opacity="0.4"/>
</svg>
