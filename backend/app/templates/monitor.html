{% extends "base.html" %}
{% block title %}NexVE — Monitoring{% endblock %}
{% block breadcrumb %}Resources{% endblock %}

{% block content %}
<div class="nx-page-header">
    <div>
        <div class="nx-page-title">Resources</div>
        <div class="nx-page-subtitle">Live system resource monitoring</div>
    </div>
    <div class="nx-flex nx-gap-2">
        <button class="nx-btn nx-btn-secondary nx-btn-sm" onclick="loadMetrics()">↻ Refresh</button>
    </div>
</div>

<div class="nx-grid nx-grid-2 nx-mb-6">
    <div class="nx-card">
        <div class="nx-card-header"><span class="nx-card-title">CPU Usage</span><span id="cpu-val" class="nx-stat-value nx-text-accent" style="font-size:var(--text-lg);">-</span></div>
        <div class="nx-card-body"><canvas id="cpu-chart" height="120"></canvas></div>
    </div>
    <div class="nx-card">
        <div class="nx-card-header"><span class="nx-card-title">Memory Usage</span><span id="mem-val" class="nx-stat-value nx-text-info" style="font-size:var(--text-lg);">-</span></div>
        <div class="nx-card-body"><canvas id="mem-chart" height="120"></canvas></div>
    </div>
    <div class="nx-card">
        <div class="nx-card-header"><span class="nx-card-title">Disk I/O</span></div>
        <div class="nx-card-body"><canvas id="disk-chart" height="120"></canvas></div>
    </div>
    <div class="nx-card">
        <div class="nx-card-header"><span class="nx-card-title">Network I/O</span></div>
        <div class="nx-card-body"><canvas id="net-chart" height="120"></canvas></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
const chartOpts = {
    responsive: true,
    maintainAspectRatio: false,
    plugins: { legend: { display: false } },
    scales: {
        x: { display: false },
        y: { beginAtZero: true, grid: { color: '#1e1e26' }, ticks: { color: '#5c5c72', font: { size: 10 } } }
    },
    elements: { line: { tension: 0.3, borderWidth: 2 }, point: { radius: 0 } }
};

function createChart(id, color, max) {
    return new Chart(document.getElementById(id), {
        type: 'line',
        data: { labels: Array(30).fill(''), datasets: [{ data: [], borderColor: color, backgroundColor: color + '22', fill: true }] },
        options: { ...chartOpts, scales: { ...chartOpts.scales, y: { ...chartOpts.scales.y, max } } }
    });
}

const cpuChart = createChart('cpu-chart', '#f97316', 100);
const memChart = createChart('mem-chart', '#3b82f6', 100);
const diskChart = createChart('disk-chart', '#22c55e', 100);
const netChart = createChart('net-chart', '#eab308', 100);

function addData(chart, val) {
    chart.data.datasets[0].data.push(val);
    if (chart.data.datasets[0].data.length > 30) chart.data.datasets[0].data.shift();
    chart.update('none');
}

async function loadMetrics() {
    try {
        const r = await fetch('/api/monitor/current');
        const data = await r.json();
        document.getElementById('cpu-val').textContent = (data.cpu || 0).toFixed(1) + '%';
        document.getElementById('mem-val').textContent = (data.memory_percent || 0).toFixed(1) + '%';
        addData(cpuChart, data.cpu || 0);
        addData(memChart, data.memory_percent || 0);
        addData(diskChart, 0);
        addData(netChart, 0);
    } catch(e) { console.error(e); }
}

loadMetrics();
setInterval(loadMetrics, 5000);
</script>
{% endblock %}
