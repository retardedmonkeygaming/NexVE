<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexVE — Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <style>
        body { background: #0a0a0a; font-family: 'Inter', system-ui, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="text-5xl font-bold text-orange-500 mb-2">NexVE</div>
            <p class="text-gray-500 text-sm">Hypervisor Dashboard</p>
        </div>

        <!-- Card -->
        <div class="bg-gray-900 border border-gray-800 rounded-xl p-8 shadow-2xl">
            <h2 class="text-white text-xl font-semibold mb-6">Sign In</h2>

            {% if error %}
            <div class="bg-red-500/10 border border-red-500/30 text-red-400 px-4 py-3 rounded-lg mb-6 text-sm">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/login" class="space-y-5">
                <div>
                    <label class="block text-gray-400 text-sm mb-2">Username</label>
                    <input type="text" name="username" required autofocus
                        class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-white
                               focus:outline-none focus:border-orange-500 transition"
                        placeholder="Enter your username">
                </div>

                <div>
                    <label class="block text-gray-400 text-sm mb-2">Password</label>
                    <input type="password" name="password" required
                        class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-white
                               focus:outline-none focus:border-orange-500 transition"
                        placeholder="Enter your password">
                </div>

                <button type="submit"
                    class="w-full bg-orange-600 hover:bg-orange-700 text-white font-semibold
                           py-3 rounded-lg transition duration-200">
                    Sign In
                </button>
            </form>
        </div>

        <p class="text-center text-gray-600 text-xs mt-6">NexVE Hypervisor v1.0</p>
    </div>
</body>
</html>
