{% extends "base.html" %}
{% block content %}
<div class="p-6">
    <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-bold">Users</h1>
        <button onclick="showModal('user-modal')" class="bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">+ Add User</button>
    </div>

    <div id="users-list" class="space-y-3"></div>
</div>

<!-- Create User Modal -->
<div id="user-modal" class="fixed inset-0 bg-black/70 flex items-center justify-center hidden z-50">
    <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-6 w-full max-w-md">
        <h2 class="text-xl font-bold mb-4">Create User</h2>
        <form hx-post="/api/users" hx-swap="none" hx-on::after-request="closeAllModals(); loadUsers();">
            <div class="space-y-3">
                <div>
                    <label class="text-zinc-400 text-sm">Username</label>
                    <input name="username" required class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 mt-1 text-white focus:ring-2 focus:ring-orange-500 outline-none">
                </div>
                <div>
                    <label class="text-zinc-400 text-sm">Email</label>
                    <input name="email" type="email" required class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 mt-1 text-white focus:ring-2 focus:ring-orange-500 outline-none">
                </div>
                <div>
                    <label class="text-zinc-400 text-sm">Password</label>
                    <input name="password" type="password" required class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 mt-1 text-white focus:ring-2 focus:ring-orange-500 outline-none">
                </div>
                <div>
                    <label class="text-zinc-400 text-sm">Role</label>
                    <select name="role" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 mt-1 text-white">
                        <option value="admin">Admin</option>
                        <option value="auditor">Auditor (read-only + logs)</option>
                        <option value="user">User (basic view)</option>
                    </select>
                </div>
            </div>
            <div class="flex justify-end gap-2 mt-6">
                <button type="button" onclick="closeAllModals()" class="px-4 py-2 text-zinc-400 hover:text-white transition">Cancel</button>
                <button type="submit" class="bg-orange-500 hover:bg-orange-600 text-white px-6 py-2 rounded-lg font-semibold transition">Create</button>
            </div>
        </form>
    </div>
</div>

<script>
function showModal(id) { document.getElementById(id).classList.remove('hidden'); }
function closeAllModals() { document.querySelectorAll('[id$="-modal"]').forEach(m => m.classList.add('hidden')); }

async function loadUsers() {
    const r = await fetch('/api/users/');
    const d = await r.json();
    let h = '';
    (d.users || []).forEach(u => {
        const roleColor = u.role === 'admin' ? 'text-orange-400' : u.role === 'auditor' ? 'text-blue-400' : 'text-zinc-400';
        h += `<div class="bg-zinc-900 border border-zinc-800 rounded-xl p-4 flex items-center justify-between">
            <div>
                <div class="flex items-center gap-3">
                    <span class="text-white font-semibold">${u.username}</span>
                    <span class="${roleColor} text-xs uppercase">${u.role}</span>
                    ${!u.is_active ? '<span class="text-red-400 text-xs">Disabled</span>' : ''}
                </div>
                <div class="text-sm text-zinc-400 mt-1">${u.email} | Created: ${u.created_at ? new Date(u.created_at).toLocaleDateString() : 'N/A'}</div>
            </div>
            <div class="flex gap-2">
                <button onclick="toggleUser(${u.id}, ${u.role === 'admin' ? "'auditor'" : "'admin'"}, ${u.is_active})" class="text-xs bg-zinc-800 hover:bg-zinc-700 px-3 py-1 rounded-lg transition">
                    ${u.role === 'admin' ? 'Demote' : 'Promote'}
                </button>
                <button onclick="toggleActive(${u.id}, '${u.role}', ${!u.is_active})" class="text-xs bg-zinc-800 hover:bg-zinc-700 px-3 py-1 rounded-lg transition">
                    ${u.is_active ? 'Disable' : 'Enable'}
                </button>
                <button onclick="deleteUser(${u.id})" class="text-xs bg-red-900 hover:bg-red-800 text-red-300 px-3 py-1 rounded-lg transition">Delete</button>
            </div>
        </div>`;
    });
    document.getElementById('users-list').innerHTML = h || '<p class="text-zinc-500">No users.</p>';
}

async function toggleUser(id, role, active) {
    const fd = new FormData();
    fd.append('role', role);
    fd.append('is_active', active);
    await fetch(`/api/users/${id}`, { method: 'PUT', body: fd });
    loadUsers();
}

async function toggleActive(id, role, active) {
    const fd = new FormData();
    fd.append('role', role);
    fd.append('is_active', active);
    await fetch(`/api/users/${id}`, { method: 'PUT', body: fd });
    loadUsers();
}

async function deleteUser(id) {
    if (!confirm('Delete this user?')) return;
    await fetch(`/api/users/${id}`, { method: 'DELETE' });
    loadUsers();
}

loadUsers();
</script>
{% endblock %}
