<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexVE — Two-Factor Authentication</title>
    <link rel="stylesheet" href="/static/css/nexve.css">
</head>
<body class="nx-login">
    <div class="nx-login-card">
        <div class="nx-login-logo">
            <h1><span>Nex</span>VE</h1>
            <p>Two-Factor Authentication</p>
        </div>

        {% if error %}
        <div style="background:var(--danger-dim);border:1px solid rgba(239,68,68,0.2);color:var(--danger);padding:10px 14px;border-radius:var(--radius-lg);font-size:var(--text-sm);margin-bottom:20px;">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login/2fa" class="nx-flex nx-flex-col nx-gap-4">
            <div class="nx-input-group">
                <label class="nx-label">Authenticator Code</label>
                <input type="text" name="totp_code" class="nx-input" placeholder="Enter 6-digit code" required maxlength="6" pattern="[0-9]{6}" autofocus style="text-align:center;font-size:var(--text-xl);letter-spacing:8px;">
            </div>
            <button type="submit" class="nx-btn nx-btn-primary nx-btn-lg nx-w-full" style="margin-top:8px;">
                Verify →
            </button>
        </form>
    </div>
</body>
</html>
