<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexVE — Two-Factor Authentication</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <style>
        body { background: #0a0a0a; font-family: 'Inter', system-ui, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <div class="text-5xl font-bold text-orange-500 mb-2">NexVE</div>
            <p class="text-gray-500 text-sm">Two-Factor Authentication</p>
        </div>

        <div class="bg-gray-900 border border-gray-800 rounded-xl p-8 shadow-2xl">
            <h2 class="text-white text-xl font-semibold mb-2">Enter 2FA Code</h2>
            <p class="text-gray-400 text-sm mb-6">Enter the 6-digit code from your authenticator app.</p>

            {% if error %}
            <div class="bg-red-500/10 border border-red-500/30 text-red-400 px-4 py-3 rounded-lg mb-6 text-sm">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/login/2fa" class="space-y-5">
                <div>
                    <label class="block text-gray-400 text-sm mb-2">Authenticator Code</label>
                    <input type="text" name="totp_code" required autofocus maxlength="6" pattern="[0-9]{6}"
                        class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-white text-center
                               text-2xl tracking-[0.5em] font-mono
                               focus:outline-none focus:border-orange-500 transition"
                        placeholder="000000" autocomplete="one-time-code">
                </div>

                <button type="submit"
                    class="w-full bg-orange-600 hover:bg-orange-700 text-white font-semibold
                           py-3 rounded-lg transition duration-200">
                    Verify
                </button>
            </form>

            <a href="/login" class="block text-center text-gray-500 text-sm mt-4 hover:text-gray-300 transition">
                ← Back to login
            </a>
        </div>
    </div>
</body>
</html>
