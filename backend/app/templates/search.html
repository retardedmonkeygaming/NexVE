{% extends "base.html" %}
{% block title %}Search — NexVE{% endblock %}
{% block breadcrumb %}Search{% endblock %}

{% block content %}
<div style="max-width:640px;margin:32px auto 0;">
    <h2 style="font-size:var(--text-xl);font-weight:700;margin-bottom:4px;">Search Results</h2>
    <p class="nx-text-muted" style="font-size:var(--text-sm);margin-bottom:20px;">
        Results for "<span style="color:var(--accent);">{{ query }}</span>"
    </p>

    <div id="search-page-results" class="nx-flex nx-flex-col nx-gap-2">
        <div class="nx-text-center nx-text-muted" style="padding:32px;">Type to search…</div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(async () => {
    const q = "{{ query }}";
    if (!q) return;
    try {
        const r = await fetch('/api/search?q=' + encodeURIComponent(q));
        const data = await r.json();
        const el = document.getElementById('search-page-results');
        if (!data.results || data.results.length === 0) {
            el.innerHTML = '<div class="nx-text-center nx-text-muted" style="padding:32px;">No results found.</div>';
        } else {
            el.innerHTML = data.results.map(r => `
                <a href="${r.url}" class="nx-card" style="display:flex;align-items:center;gap:16px;padding:14px 18px;text-decoration:none;">
                    <span style="font-size:20px;">${r.icon}</span>
                    <div style="flex:1;">
                        <div style="font-weight:600;color:var(--text-primary);">${r.name}</div>
                        <div style="font-size:var(--text-xs);color:var(--text-muted);">${r.type} — ${r.status}</div>
                    </div>
                    <span style="color:var(--text-muted);font-size:var(--text-xs);">→</span>
                </a>
            `).join('');
        }
    } catch(e) {
        console.error('Search failed:', e);
    }
})();
</script>
{% endblock %}
