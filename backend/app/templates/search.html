{% extends "base.html" %}
{% block title %}Search — NexVE{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto mt-10">
    <h1 class="text-2xl font-bold text-white mb-2">Search Results</h1>
    <p class="text-gray-500 text-sm mb-6">Results for "<span class="text-orange-400">{{ query }}</span>"</p>

    <div id="search-page-results" class="space-y-2">
    </div>
</div>

{% block scripts %}
<script>
(async () => {
    const q = "{{ query }}";
    if (!q) return;
    const r = await fetch('/api/search?q=' + encodeURIComponent(q));
    const data = await r.json();
    const el = document.getElementById('search-page-results');
    if (data.results.length === 0) {
        el.innerHTML = '<p class="text-gray-500 text-sm">No results found.</p>';
    } else {
        el.innerHTML = data.results.map(r => `
            <a href="${r.url}" class="flex items-center gap-4 bg-gray-900 border border-gray-800 rounded-xl p-4 hover:border-gray-600 transition">
                <span class="text-2xl">${r.icon}</span>
                <div class="flex-1">
                    <div class="text-white font-medium">${r.name}</div>
                    <div class="text-gray-500 text-sm">${r.type} — ${r.status}</div>
                </div>
                <span class="text-gray-600 text-xs">→</span>
            </a>
        `).join('');
    }
})();
</script>
{% endblock %}
{% endblock %}
