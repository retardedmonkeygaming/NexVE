{% extends "base.html" %}
{% block title %}NexVE — Shell{% endblock %}
{% block breadcrumb %}Shell{% endblock %}

{% block head %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
<style>
    #terminal-container { height: calc(100vh - 180px); background: #0a0a0a; border-radius: var(--radius-lg); overflow: hidden; }
    .xterm { padding: 8px; }
</style>
{% endblock %}

{% block content %}
<div id="terminal-container"></div>
{% endblock %}

{% block scripts %}
<script>
const term = new Terminal({
    theme: {
        background: '#0a0a0a',
        foreground: '#e5e7eb',
        cursor: '#f97316',
        selectionBackground: '#f9731633',
    },
    fontFamily: "'JetBrains Mono', 'Fira Code', monospace",
    fontSize: 14,
    cursorBlink: true,
});

const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById('terminal-container'));
fitAddon.fit();

const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
const ws = new WebSocket(`${protocol}//${location.host}/api/console/shell`);
ws.binaryType = 'arraybuffer';

ws.onopen = () => {
    term.write('\\r\\x1b[33mConnected to NexVE shell\\x1b[0m\\r\\n');
};

ws.onmessage = (evt) => {
    if (typeof evt.data === 'string') {
        term.write(evt.data);
    } else {
        const decoder = new TextDecoder();
        term.write(decoder.decode(evt.data));
    }
};

ws.onclose = () => {
    term.write('\\r\\x1b[31mConnection closed. Refresh to reconnect.\\x1b[0m\\r\\n');
};

term.onData(data => {
    if (ws.readyState === WebSocket.OPEN) {
        ws.send(data);
    }
});

window.addEventListener('resize', () => fitAddon.fit());
</script>
{% endblock %}
