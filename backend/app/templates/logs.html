{% extends "base.html" %}
{% block title %}NexVE — Logs{% endblock %}
{% block breadcrumb %}Logs{% endblock %}

{% block content %}
<div class="nx-page-header">
    <div>
        <div class="nx-page-title">Activity Logs</div>
        <div class="nx-page-subtitle">Audit trail of all system actions</div>
    </div>
    <button class="nx-btn nx-btn-secondary nx-btn-sm" onclick="loadLogs()">↻ Refresh</button>
</div>

<div class="nx-card">
    <div class="nx-card-body" style="padding:0;">
        <table class="nx-table">
            <thead>
                <tr><th>Timestamp</th><th>User</th><th>Action</th><th>Target</th><th>Details</th></tr>
            </thead>
            <tbody id="log-list">
                <tr><td colspan="5" class="nx-text-center nx-text-muted" style="padding:32px;">Loading logs...</td></tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadLogs() {
    try {
        const r = await fetch('/api/activity/?limit=50');
        const data = await r.json();
        const logs = data.logs || [];
        document.getElementById('log-list').innerHTML = logs.map(l => `
            <tr>
                <td style="font-family:var(--font-mono);font-size:var(--text-xs);white-space:nowrap;">${l.created_at ? new Date(l.created_at).toLocaleString() : '-'}</td>
                <td>${l.username || 'system'}</td>
                <td><span class="nx-badge nx-badge-accent">${l.action || '-'}</span></td>
                <td>${l.target_type ? l.target_type + (l.target_name ? ': ' + l.target_name : '') : '-'}</td>
                <td style="color:var(--text-muted);max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${l.details || ''}</td>
            </tr>
        `).join('') || '<tr><td colspan="5" class="nx-text-center nx-text-muted" style="padding:32px;">No logs found</td></tr>';
    } catch(e) { console.error(e); }
}

loadLogs();
</script>
{% endblock %}
